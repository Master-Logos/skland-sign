name: Daily Sign In

on:
  workflow_dispatch:
    inputs:
      force_email:
        description: "强制发送汇总邮件；外部定时服务请传 false"
        type: boolean
        default: true
  # 定时触发已交给 cron-job.org（每北京 09:00 调 dispatch API），
  # 这里刻意关闭 GitHub 自带 schedule，避免和外部定时重复触发。
  # 若将来需要恢复，取消下面注释即可（注意与 cron-job.org 的时间错开）。
  # schedule:
  #   # UTC 01:17 = 北京 09:17
  #   - cron: "17 1 * * *"
  #   # UTC 01:20 = 北京 09:20
  #   - cron: "20 1 * * *"
  #   # UTC 01:25 = 北京 09:25
  #   - cron: "25 1 * * *"

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 森空岛
      SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
      SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
      SKLAND_USERS_JSON: ${{ secrets.SKLAND_USERS_JSON }}
      # 镜客居
      JKJU_USER: ${{ secrets.JKJU_USER }}
      JKJU_PASSWORD: ${{ secrets.JKJU_PASSWORD }}
      JKJU_MODE: ${{ secrets.JKJU_MODE }}
      # 邮件汇总
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      EMAIL_SMTP_HOST: smtp.qq.com
      EMAIL_SMTP_PORT: "465"
      # 手动触发时强制发邮件；定时触发时由脚本按错峰去重逻辑决定
      # 外部 cron 通过 workflow_dispatch 触发，必须显式传 force_email=false
      FORCE_EMAIL: ${{ inputs.force_email }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.yaml from CONFIG_YAML secret
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            printf '%s\n' "$CONFIG_YAML" > config.yaml
            echo "已从 CONFIG_YAML secret 生成 config.yaml"
          else
            echo "未配置 CONFIG_YAML，将使用 SKLAND_TOKEN(S) 环境变量"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r jkju/requirements.txt

      - name: Run unified sign in
        run: python daily_sign.py
