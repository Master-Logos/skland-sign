name: JKJU Sign In

on:
  workflow_dispatch:
  # 定时已迁移到 daily-sign.yml（统一签到 + 邮件汇总），此处保留手动触发
  # schedule:
  #   - cron: "17 0 * * *"
  #   - cron: "20 0 * * *"
  #   - cron: "23 0 * * *"

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JKJU_USER: ${{ secrets.JKJU_USER }}
      JKJU_PASSWORD: ${{ secrets.JKJU_PASSWORD }}
      JKJU_MODE: ${{ secrets.JKJU_MODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r jkju/requirements.txt

      - name: Run sign in
        run: python jkju/main.py
