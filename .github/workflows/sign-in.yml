name: Skland Sign In

on:
  workflow_dispatch:
  # 定时已迁移到 daily-sign.yml（统一签到 + 邮件汇总），此处保留手动触发
  # schedule:
  #   - cron: "17 1 * * *"
  #   - cron: "23 1 * * *"

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
      SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
      SKLAND_USERS_JSON: ${{ secrets.SKLAND_USERS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.yaml from CONFIG_YAML secret
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            printf '%s\n' "$CONFIG_YAML" > config.yaml
            echo "已从 CONFIG_YAML secret 生成 config.yaml"
          else
            echo "未配置 CONFIG_YAML，将使用 SKLAND_TOKEN(S) 环境变量"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sign in
        run: python main.py
